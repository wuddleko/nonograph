services:
  nostorgraph:
    build: .
    container_name: nostorgraph_app
    ports:
      - "127.0.0.1:8009:8009"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /run
    volumes:
      - ${HOME}/nostorgraph/content:/app/content
      - ${HOME}/nostorgraph/tor:/var/lib/tor
      - ${HOME}/nostorgraph/onion:/var/lib/tor/hidden_service
      - ./Config.toml:/app/Config.toml:ro
    environment:
      - ROCKET_ADDRESS=0.0.0.0
      - ROCKET_PORT=8009
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8009/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 240s
    networks:
      - nostorgraph_network

networks:
  nostorgraph_network:
