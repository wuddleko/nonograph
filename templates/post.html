<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>{{title}}</title>
        <link rel="icon" href="data:," />
        <meta property="og:title" content="{{title}}" />
        <meta property="og:type" content="article" />
        <meta property="og:url" content="{{url}}" />
        <meta property="og:description" content="{{description}}" />
        <meta property="article:author" content="{{author}}" />
        <meta property="article:published_time" content="{{created_at_iso}}" />
        <meta name="author" content="{{author}}" />
        <link rel="stylesheet" href="/post.css?v={{asset_version}}" />
        {{fallback_css}}
    </head>
    <body>
        <div class="container">
            <div class="content">
                <h1>{{title}}</h1>
                <svg class="wave" viewBox="0 0 640 16" preserveAspectRatio="none" aria-hidden="true">
                    <path d="M0 8 L16 3 L32 13 L48 3 L64 13 L80 3 L96 13 L112 3 L128 13 L144 3 L160 13 L176 3 L192 13 L208 3 L224 13 L240 3 L256 13 L272 3 L288 13 L304 3 L320 13 L336 3 L352 13 L368 3 L384 13 L400 3 L416 13 L432 3 L448 13 L464 3 L480 13 L496 3 L512 13 L528 3 L544 13 L560 3 L576 13 L592 3 L608 13 L624 3 L640 8"></path>
                </svg>
                <div class="article-meta">{{author_display}}{{created_at}}</div>
                <div class="article-content" id="CONTENT">{{content}}</div>
            </div>
        </div>

        <div class="footer">
            <a href="/" target="_blank">write your own</a>
            <a href="/legal" target="_blank">legal</a>
            <a href="/api" target="_blank">api</a>
            <a href="{{mode_href}}" target="_blank">{{mode_label}}</a>
            <a href="https://github.com/wuddleko/nonograph" target="_blank"
                >source code</a
            >
        </div>

        <noscript>
            <link rel="stylesheet" href="/post-noscript.css?v={{asset_version}}" />
        </noscript>

        {{scripts}}
    </body>
    <!-- Published with Nonograph, an open-source writing service -->
</html>
