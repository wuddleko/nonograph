<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        {{theme_boot}}
        <title>{{title}}</title>
        <link rel="icon" type="image/png" href="/logo.png?v={{asset_version}}" />
        <meta property="og:title" content="{{title}}" />
        <meta property="og:type" content="article" />
        <meta property="og:url" content="{{url}}" />
        <meta property="og:description" content="{{description}}" />
        <meta property="article:author" content="{{author}}" />
        <meta property="article:published_time" content="{{created_at_iso}}" />
        <meta name="author" content="{{author}}" />
        <link rel="stylesheet" href="/post.css?v={{asset_version}}" />
        {{fallback_css}}
    </head>
    <body>
        <div class="container">
            <div class="content">
                <h1>{{title}}</h1>
                <svg class="wave" viewBox="0 0 640 16" preserveAspectRatio="none" aria-hidden="true">
                    <path d="M0 8 H640"></path>
                </svg>
                <div class="article-meta">{{author_display}}{{created_at}}</div>
                <div class="article-content" id="CONTENT">{{content}}</div>
            </div>
        </div>

        <div class="footer">
            <a href="/" target="_blank">write your own</a>
            <a href="/legal" target="_blank">legal</a>
            <a href="/api" target="_blank">api</a>
            <a href="{{mode_href}}" target="_blank">{{mode_label}}</a>
            <a href="https://github.com/wuddleko/nostorgraph" target="_blank"
                >source code</a
            >
            <button type="button" class="theme-toggle" aria-label="Dark mode"><span class="theme-to-dark">dark</span><span class="theme-to-light">light</span></button>
        </div>

        <noscript>
            <link rel="stylesheet" href="/post-noscript.css?v={{asset_version}}" />
        </noscript>

        {{scripts}}
    </body>
    <!-- Published with Nostorgraph, an open-source writing service -->
</html>
