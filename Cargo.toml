[package]
name = "nonograph"
version = "0.4.6"
edition = "2021"

[workspace]
members = ["parser", "page", "nip44"]

[dependencies]
rocket = { version = "0.5", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
ammonia = "3.3"
toml = "0.8"
deunicode = "1.4"
nonograph-parser = { path = "parser" }
nonograph-nip44 = { path = "nip44" }
reqwest = { version = "0.11", features = ["json"] }
serde_json = "1.0"
url = "2.4"
sha2 = "0.10"
socket2 = "0.5"
secp256k1 = { version = "0.29", features = ["rand", "rand-std", "global-context"] }
bech32 = "0.11"
tungstenite = { version = "0.26", features = ["native-tls"] }
native-tls = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.0"
serial_test = "3.0"

[build-dependencies]
sha2 = "0.10"
wasm-bindgen-cli-support = "=0.2.100"
