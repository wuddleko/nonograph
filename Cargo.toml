[package]
name = "nonograph"
version = "0.4.6"
edition = "2021"

[workspace]
members = ["parser", "page", "nip44", "crawler"]

[dependencies]
rocket = { version = "0.5", features = ["json"] }
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
ammonia = "3.3"
toml = "0.8"
crawler = { path = "crawler" }
nonograph-parser = { path = "parser" }
nonograph-nip44 = { path = "nip44" }
serde_json = { version = "1.0", features = ["raw_value"] }
url = "2.4"
hmac = "0.12"
sha2 = "0.10"
socket2 = "0.5"
secp256k1 = { version = "0.29", features = ["rand", "rand-std", "global-context"] }
tungstenite = { version = "0.26", features = ["native-tls"] }
native-tls = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.0"
serial_test = "3.0"
bech32 = "0.11"

[build-dependencies]
wasm-bindgen-cli-support = "=0.2.100"
