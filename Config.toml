# Nonograph Configuration File

[limits]
# Maximum title length in characters
title_max_length = 128

# Maximum alias/author name length in characters
alias_max_length = 32

# Maximum content length in characters
content_max_length = 256_000

# Maximum form data size in KB
form_data_limit_kb = 512

[server]
# Server port (can be overridden by ROCKET_PORT environment variable)
port = 8009

# Server address
address = "127.0.0.1"

# Onion-Location header: advertise a Tor onion counterpart of this site.
# Leave empty to auto-detect from the ONION_URL env var or the Tor hostname
# file below. Set a full URL (e.g. "http://abcd...xyz.onion") to override.
onion_url = ""
onion_hostname_file = "/var/lib/tor/hidden_service/hostname"

[cache]
# Maximum cache size in MB
max_cache_size_mb = 128

# How often to check for deleted posts and remove them from cache (minutes)
cache_purge_interval_mins = 60

[security]
# Maximum URL length for link processing
max_url_length = 4096

# Enable/disable external link security attributes
external_link_security = true

# Enable/disable CSRF protection
# For production deployments, this should always be 'true'
csrf_protection_enabled = true

[theme]
# Syntax highlighting theme for code blocks
# Available themes: "base16-ocean.dark", "base16-ocean.light",
# "base16-mocha.dark", "base16-mocha.light", "base16-eighties.dark",
# "base16-eighties.light", "Solarized (dark)", "Solarized (light)", "InspiredGitHub"
syntax_highlighting = "InspiredGitHub"

[nostr]
# Relays that receive each published note. The link includes the ones that accept it.
# Use relays that accept public long-form writes. Search-only or dead ones
# make On Nostr fail even when the event is valid.
relays = [
    "wss://relay.primal.net",
    "wss://relay.snort.social",
    "wss://offchain.pub",
]
# How long to wait for a relay, in seconds. The wait is the slowest relay, not the sum.
timeout_secs = 3
