name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary-suffix: ""
            archive-suffix: ".tar.gz"
          - os: macos-latest
            target: x86_64-apple-darwin
            binary-suffix: ""
            archive-suffix: ".zip"
          - os: macos-latest
            target: aarch64-apple-darwin
            binary-suffix: ""
            archive-suffix: ".zip"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary-suffix: ".exe"
            archive-suffix: ".zip"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }},wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Get OS info (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          echo "OS_VERSION=$(uname -a)" >> $GITHUB_ENV
          echo "KERNEL_VERSION=$(uname -r)" >> $GITHUB_ENV

      - name: Get OS info (Windows)
        if: runner.os == 'Windows'
        run: |
          $osInfo = Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, TotalPhysicalMemory
          $osVersion = "$($osInfo.WindowsProductName) $($osInfo.WindowsVersion)"
          echo "OS_VERSION=$osVersion" >> $env:GITHUB_ENV

      - name: Create build info file
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_OS: ${{ matrix.os }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            echo "Build Information for nostorgraph ${RELEASE_TAG}"
            echo "================================================="
            echo "Target: ${BUILD_TARGET}"
            echo "OS: ${BUILD_OS}"
            echo "OS Version: ${OS_VERSION:-unknown}"
            if [ -n "${KERNEL_VERSION:-}" ]; then
              echo "Kernel: ${KERNEL_VERSION}"
            fi
            echo "Rust Version: $(rustc --version)"
            echo "Cargo Version: $(cargo --version)"
            echo "Build Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Commit SHA: ${COMMIT_SHA}"
          } > "build-info-${BUILD_TARGET}.txt"

      - name: Upload build info
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-info-${{ matrix.target }}
          path: build-info-${{ matrix.target }}.txt
          if-no-files-found: error
          overwrite: true

      - name: Prepare release files (Linux)
        if: runner.os == 'Linux'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p release
          cp target/${{ matrix.target }}/release/nostorgraph${{ matrix.binary-suffix }} release/nostorgraph${{ matrix.binary-suffix }}
          cp README.md LICENSE Config.toml release/
          cp -r pages templates release/
          mkdir -p release/scripts
          cp scripts/run scripts/nostorgraph.sh scripts/status.sh release/scripts/
          cp build-info-${{ matrix.target }}.txt release/
          cd release
          tar -czf "../nostorgraph-${RELEASE_TAG}-${{ matrix.target }}${{ matrix.archive-suffix }}" .

      - name: Prepare release files (macOS)
        if: runner.os == 'macOS'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p release
          cp target/${{ matrix.target }}/release/nostorgraph${{ matrix.binary-suffix }} release/nostorgraph${{ matrix.binary-suffix }}
          cp README.md LICENSE Config.toml release/
          cp -r pages templates release/
          mkdir -p release/scripts
          cp scripts/run scripts/nostorgraph.sh scripts/status.sh release/scripts/
          cp build-info-${{ matrix.target }}.txt release/
          cd release
          zip -r "../nostorgraph-${RELEASE_TAG}-${{ matrix.target }}${{ matrix.archive-suffix }}" .

      - name: Prepare release files (Windows)
        if: runner.os == 'Windows'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir release
          Copy-Item "target\${{ matrix.target }}\release\nostorgraph${{ matrix.binary-suffix }}" "release\nostorgraph${{ matrix.binary-suffix }}"
          Copy-Item README.md, LICENSE, Config.toml -Destination release
          Copy-Item pages, templates, scripts -Destination release -Recurse
          Copy-Item build-info-${{ matrix.target }}.txt -Destination release
          cd release
          Compress-Archive -Path * -DestinationPath "../nostorgraph-${env:RELEASE_TAG}-${{ matrix.target }}${{ matrix.archive-suffix }}"

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" "./nostorgraph-${RELEASE_TAG}-${{ matrix.target }}${{ matrix.archive-suffix }}" --clobber

  create-combined-build-info:
    name: Create Combined Build Info
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build info
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-info-*
          path: build-info

      - name: Create combined build info
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          mapfile -t files < <(find build-info -type f -name 'build-info-*.txt' | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no per-target build info was downloaded" >&2
            exit 1
          fi
          {
            echo "Combined Build Information for nostorgraph ${RELEASE_TAG}"
            echo "==============================================================="
            echo "Release Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Commit SHA: ${COMMIT_SHA}"
            echo
            for file in "${files[@]}"; do
              echo "-----"
              cat "$file"
              echo
            done
          } > combined-build-info.txt

      - name: Upload combined build info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" ./combined-build-info.txt --clobber
